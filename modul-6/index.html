<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Fetch API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Daftar Pengguna</h2>
        <p class="subtitle">Praktikum Asynchronous Javascript & Fetching API</p>

        <!-- Tombol Aksi -->
        <div class="actions-bar">
            <button class="btn-primary" id="btnFetch">Muat Data Pengguna</button>
        </div>

        <!-- Indikator Status -->
        <div class="status-msg" id="statusMessage">
            Klik tombol di atas untuk memuat data pengguna
        </div>

        <!-- Container Card Pengguna -->
        <div class="user-grid" id="userList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
